<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Practice exam catalog flow</title>
  <desc id="description">Comparison of the former singleton review-gated exam flow with the new typed catalog, set-specific storage, and automatic deployment flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#496078"/>
    </marker>
    <style>
      .bg { fill: #eef3f7; }
      .panel { fill: #ffffff; stroke: #cad5e1; stroke-width: 2; }
      .dark { fill: #172238; }
      .blue { fill: #1367d1; }
      .green { fill: #e1f4eb; stroke: #268060; stroke-width: 2; }
      .amber { fill: #fff1d6; stroke: #b47816; stroke-width: 2; }
      .node { fill: #f7f9fb; stroke: #8da0b5; stroke-width: 2; }
      .line { fill: none; stroke: #496078; stroke-width: 3; marker-end: url(#arrow); }
      .heading { fill: #172238; font: 700 28px Georgia, serif; }
      .label { fill: #172238; font: 700 18px Inter, Arial, sans-serif; }
      .copy { fill: #52647a; font: 15px Inter, Arial, sans-serif; }
      .white { fill: #ffffff; }
      .small { font-size: 13px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="heading" x="60" y="58">Before: singleton runtime approval</text>
  <rect class="panel" x="50" y="85" width="1100" height="205" rx="8"/>
  <rect class="node" x="90" y="145" width="190" height="80" rx="6"/>
  <text class="label" x="185" y="178" text-anchor="middle">Candidate set</text>
  <text class="copy small" x="185" y="202" text-anchor="middle">One hardcoded ID</text>
  <path class="line" d="M 280 185 H 365"/>
  <rect class="amber" x="365" y="145" width="230" height="80" rx="6"/>
  <text class="label" x="480" y="178" text-anchor="middle">Markdown acceptance</text>
  <text class="copy small" x="480" y="202" text-anchor="middle">Parsed in browser bundle</text>
  <path class="line" d="M 595 185 H 680"/>
  <rect class="node" x="680" y="145" width="190" height="80" rx="6"/>
  <text class="label" x="775" y="178" text-anchor="middle">Active singleton</text>
  <text class="copy small" x="775" y="202" text-anchor="middle">No user selection</text>
  <path class="line" d="M 870 185 H 955"/>
  <rect class="dark" x="955" y="145" width="150" height="80" rx="6"/>
  <text class="label white" x="1030" y="190" text-anchor="middle">Attempt</text>

  <text class="heading" x="60" y="355">After: typed catalog and automatic publication</text>
  <rect class="panel" x="50" y="382" width="1100" height="260" rx="8"/>
  <rect class="blue" x="90" y="462" width="190" height="90" rx="6"/>
  <text class="label white" x="185" y="497" text-anchor="middle">Typed catalog</text>
  <text class="copy small white" x="185" y="523" text-anchor="middle">User chooses a set</text>
  <path class="line" d="M 280 507 H 315 V 461 H 355"/>
  <path class="line" d="M 280 507 H 315 V 573 H 355"/>
  <rect class="green" x="355" y="420" width="220" height="82" rx="6"/>
  <text class="label" x="465" y="453" text-anchor="middle">Set 1 available</text>
  <text class="copy small" x="465" y="477" text-anchor="middle">Frozen SHA-256 digest</text>
  <rect class="amber" x="355" y="532" width="220" height="82" rx="6"/>
  <text class="label" x="465" y="565" text-anchor="middle">Set 2 coming soon</text>
  <text class="copy small" x="465" y="589" text-anchor="middle">Metadata only, no questions</text>
  <path class="line" d="M 575 461 H 660"/>
  <rect class="node" x="660" y="420" width="210" height="82" rx="6"/>
  <text class="label" x="765" y="453" text-anchor="middle">Set-specific attempt</text>
  <text class="copy small" x="765" y="477" text-anchor="middle">Independent localStorage key</text>
  <path class="line" d="M 870 461 H 955"/>
  <rect class="dark" x="955" y="420" width="150" height="82" rx="6"/>
  <text class="label white" x="1030" y="466" text-anchor="middle">Exam flow</text>
  <rect class="node" x="660" y="532" width="210" height="82" rx="6"/>
  <path class="line" d="M 575 461 H 620 V 573 H 660"/>
  <text class="label" x="765" y="565" text-anchor="middle">Automated CI audit</text>
  <text class="copy small" x="765" y="589" text-anchor="middle">Sources, audit records, frozen set</text>
  <path class="line" d="M 870 573 H 955"/>
  <rect class="green" x="955" y="532" width="150" height="82" rx="6"/>
  <text class="label" x="1030" y="565" text-anchor="middle">Pages deploy</text>
  <text class="copy small" x="1030" y="589" text-anchor="middle">On main push</text>
</svg>

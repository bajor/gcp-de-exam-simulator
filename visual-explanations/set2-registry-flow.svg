<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370" role="img" aria-labelledby="title description">
  <title id="title">Practice Exam 2 isolated registry flow</title>
  <desc id="description">Frozen Practice Exam 1 registries and isolated Practice Exam 2 registries feed the aggregate verification registry. Complete candidates require independent review before the runtime catalog can publish them.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #102a43; }
    .box { fill: #f0f7ff; stroke: #1f6feb; stroke-width: 2; rx: 10; }
    .frozen { fill: #f6f8fa; stroke: #57606a; stroke-width: 2; rx: 10; }
    .review { fill: #fff8c5; stroke: #9a6700; stroke-width: 2; rx: 10; }
    .publish { fill: #dafbe1; stroke: #1a7f37; stroke-width: 2; rx: 10; }
    .arrow { fill: none; stroke: #57606a; stroke-width: 2; marker-end: url(#arrow); }
    .label { font-size: 18px; font-weight: 700; }
    .detail { font-size: 14px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect class="frozen" x="35" y="52" width="205" height="105"/>
  <text class="label" x="61" y="89">Frozen Set 1</text>
  <text class="detail" x="61" y="115">sections, drafts, candidates</text>
  <text class="detail" x="61" y="137">fixed SHA-256 digest</text>
  <rect class="box" x="35" y="220" width="205" height="105"/>
  <text class="label" x="61" y="257">Isolated Set 2</text>
  <text class="detail" x="61" y="283">sections, drafts, candidates</text>
  <text class="detail" x="61" y="305">versioned corrections</text>
  <rect class="box" x="340" y="130" width="220" height="105"/>
  <text class="label" x="370" y="168">Aggregate registry</text>
  <text class="detail" x="370" y="194">structural and source checks</text>
  <text class="detail" x="370" y="216">audit record tools</text>
  <rect class="review" x="660" y="130" width="165" height="105"/>
  <text class="label" x="688" y="168">Independent</text>
  <text class="label" x="700" y="191">review</text>
  <text class="detail" x="684" y="216">exact digest bound</text>
  <rect class="publish" x="900" y="130" width="105" height="105"/>
  <text class="label" x="918" y="168">Runtime</text>
  <text class="label" x="918" y="191">catalog</text>
  <text class="detail" x="917" y="216">available</text>
  <path class="arrow" d="M240 105 H340"/>
  <path class="arrow" d="M240 272 H285 V182 H340"/>
  <path class="arrow" d="M560 182 H660"/>
  <path class="arrow" d="M825 182 H900"/>
</svg>
